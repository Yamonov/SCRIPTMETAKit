name: SCRIPTMETAKit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: clippy,rustfmt
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install cargo-about
        run: cargo install --locked --features cli --version 0.9.1 cargo-about
      - name: Verify third-party licenses
        run: ./script/generate_third_party_licenses.sh --check
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Rust default feature boundary
        run: cargo check --workspace --no-default-features --locked
      - name: Rust lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: All Rust and C ABI regression tests
        run: cargo test --workspace --all-features --locked -- --test-threads=1
      - name: Validate the committed macOS binary for both CPUs
        run: python3 script/validate_macos_binary.py Artifacts/ScriptMetaKitFFI.xcframework/macos-arm64_x86_64/libscriptmetakit_ffi.dylib
      - name: Build binary XCFramework
        run: ./script/build_xcframework.sh
      - name: Reject local build paths in the binary
        run: |
          if strings Artifacts/ScriptMetaKitFFI.xcframework/macos-arm64_x86_64/libscriptmetakit_ffi.dylib | grep -F "$GITHUB_WORKSPACE"; then
            echo "XCFramework contains the checkout path"
            exit 1
          fi
      - name: Swift 5 language compatibility
        run: swift test -Xswiftc -swift-version -Xswiftc 5
      - name: Swift 6 strict concurrency
        run: swift test -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -strict-concurrency=complete
      - name: Xcode package embedding and headless application smoke
        run: |
          xcodebuild -workspace tests/integration/KitIntegration.xcworkspace \
            -scheme KitIntegration -configuration Release -destination 'platform=macOS' \
            -derivedDataPath build/kit-integration build
          codesign --verify --deep --strict build/kit-integration/Build/Products/Release/KitIntegration.app
          build/kit-integration/Build/Products/Release/KitIntegration.app/Contents/MacOS/KitIntegration

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: clippy,rustfmt
      - name: Rust default feature boundary
        run: cargo check --workspace --no-default-features --locked
      - name: Rust all feature boundary
        run: cargo check --workspace --all-features --locked
      - name: Rust lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --all-features --locked
      - name: Build release FFI DLL
        run: ./script/build_windows.ps1 -Release
