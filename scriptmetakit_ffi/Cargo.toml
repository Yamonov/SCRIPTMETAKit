[package]
name = "scriptmetakit_ffi"
version = "1.2.2"
edition = "2024"
rust-version = "1.94"
description = "C ABI bridge for SCRIPTMETAKit."
license = "Apache-2.0"
publish = false

[lib]
name = "scriptmetakit_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]
doctest = false

[dependencies]
pollster = "0.4"
scriptmetakit = { path = ".." }
url = "2"

[features]
default = []
blocking-http = ["scriptmetakit/blocking-http"]
native-watch = ["scriptmetakit/native-watch"]

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSString", "NSObjCRuntime", "NSURL"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
