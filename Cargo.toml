[package]
name = "scriptmetakit"
version = "1.2.2"
edition = "2024"
rust-version = "1.94"
description = "Rust library for parsing and scanning SCRIPTMETA metadata."
license = "Apache-2.0"
publish = false

[workspace]
members = [".", "scriptmetakit_ffi", "scriptmetakit_macos_io"]
resolver = "3"

[lib]
name = "scriptmetakit"
path = "src/lib.rs"

[dependencies]
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
httpdate = { version = "1", optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
fsevent-sys = "4.1"
libc = "0.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSString", "NSObjCRuntime", "NSURL"] }
scriptmetakit_macos_io = { path = "scriptmetakit_macos_io" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[features]
default = []
blocking-http = ["dep:httpdate", "dep:reqwest", "dep:tokio"]
native-watch = []

[dev-dependencies]
pollster = "0.4"
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
